# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: codenplay
# "service" is the name of this project. This will also be added to your AWS resource names.
service: orderService

provider:
  name: aws
  runtime: nodejs22.x
  region: ap-southeast-2
  environment:
    REGION: ap-southeast-2
    DYNAMODB_TABLE: Orders
    ORDERS_QUEUE_URL: https://sqs.ap-southeast-2.amazonaws.com/017341176574/OrdersQueue
  iamRoleStatements:
    - Effect: "Allow"
      Action:
        - "dynamodb:PutItem"
        - "sqs:SendMessage"
        - "sqs:ReceiveMessage"
        - "sqs:DeleteMessage"
        - "ses:SendEmail"
      Resource:
        - Fn::GetAtt: [OrderTable, Arn]
        - Fn::GetAtt: [OrdersQueue, Arn]
        - arn:aws:ses:ap-southeast-2:017341176574:identity/sr.hallow@gmail.com

resources:
  Resources:
    # Define your AWS resources here, such as DynamoDB tables, S3 buckets, etc.
    OrderTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: Orders
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
    OrdersQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: OrdersQueue
    OrderServiceEmailIdentity:   # This is the SES email identity that will be used to send order confirmation emails
      Type: AWS::SES::EmailIdentity
      Properties:
        EmailIdentity: "sr.hallow@gmail.com"
functions:
  placeOrder:
    handler: handlers/placeOrder.placeOrder
    events:
      - httpApi:
          path: /place-order
          method: post
  processOrder:
    handler: handlers/processOrder.processOrder
    events:
      - sqs:
          arn:
            Fn::GetAtt: [OrdersQueue, Arn]